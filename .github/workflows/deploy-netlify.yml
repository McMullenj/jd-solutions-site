name: Deploy to Netlify

on:
  workflow_dispatch:
    inputs:
      deploy_message:
        description: Optional deploy label in Netlify
        required: false
        default: ''

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
      VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      VITE_AUTH_MODE: ${{ secrets.VITE_AUTH_MODE || 'supabase' }}
    steps:
      - name: Validate required secrets
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        run: |
          set -euo pipefail
          missing=0
          for key in NETLIFY_AUTH_TOKEN NETLIFY_SITE_ID VITE_API_BASE_URL VITE_SUPABASE_URL VITE_SUPABASE_ANON_KEY; do
            if [[ -z "${!key:-}" ]]; then
              echo "::error::Missing GitHub secret: ${key}"
              missing=1
            fi
          done
          if [[ "$missing" -ne 0 ]]; then
            echo "See docs/github-actions.md for required secret setup."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build combined site
        run: pnpm build

      - name: Verify product bundle paths
        run: |
          set -euo pipefail
          test -f apps/web/dist/index.html
          test -f apps/web/dist/split-frame/app/index.html
          grep -q '/split-frame/app/assets/' apps/web/dist/split-frame/app/index.html

      - name: Deploy to Netlify
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        run: |
          set -euo pipefail
          npm install -g netlify-cli@17
          label="${{ inputs.deploy_message }}"
          if [[ -z "$label" ]]; then
            label="GHA deploy ${GITHUB_SHA::7} by ${GITHUB_ACTOR}"
          fi
          netlify deploy \
            --prod \
            --dir=apps/web/dist \
            --site="$NETLIFY_SITE_ID" \
            --message="$label" \
            --auth="$NETLIFY_AUTH_TOKEN"
